<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hideout</title>
  <!--
    Strict CSP, no unsafe-eval. All sidecar traffic flows through the runtime's
    network bridge (Vantail IPC), so the webview never fetches directly.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none';"
  />
  <style>
    /* Chat-specific additions on top of Tailwind tokens (see src/style.css). */
    body { background: var(--bg); color: var(--text); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- Custom title bar: native traffic lights left; two actions right -->
  <div class="titlebar" id="titlebar">
    <span class="titlebar-title">Hideout</span>
    <div class="ml-auto flex items-center gap-1 pr-3">
      <button id="sidebar-toggle-btn" class="icon-btn-sm" type="button" title="Toggle panel" aria-label="Toggle panel">
        <!-- sidebar toggle icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="12" height="10" rx="1.5"/><line x1="6" y1="3" x2="6" y2="13"/>
        </svg>
      </button>
      <button id="new-chat-btn" class="icon-btn-sm" type="button" title="New chat" aria-label="New chat">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 2.5a2 2 0 0 1 2.8 2.8L7 12l-3.5 1 1-3.5 6.5-6Z"/><path d="M10.2 3.7 12.3 5.8"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Layout: main chat + right panel -->
  <div class="chat-layout">
    <main class="chat-main" id="chat-main">
      <!-- Empty state: centered llama icon -->
      <div id="empty-state" class="empty-state">
        <div class="llama-mark">🦙</div>
        <p class="text-sm text-muted">Ask anything</p>
      </div>
      <!-- Message list -->
      <div id="messages" class="messages" aria-live="polite"></div>
    </main>

    <!-- Right panel: choose model + assistant -->
    <aside id="side-panel" class="side-panel">
      <div class="side-section">
        <h2 class="side-title">Model</h2>
        <div id="model-list" class="side-list"></div>
      </div>
      <div class="side-section">
        <h2 class="side-title">Assistant</h2>
        <div id="assistant-list" class="side-list"></div>
      </div>
    </aside>
  </div>

  <!-- Composer -->
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="chat-input" class="composer-input" rows="1"
        placeholder="Send a message"></textarea>
      <div class="composer-tools">
        <button id="composer-plus" class="composer-btn" type="button" title="Attach / tools" aria-label="Attach tools">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/>
          </svg>
        </button>
        <button id="composer-model" class="composer-model" type="button">
          <span id="composer-model-label">Choosing…</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4.5 6 7.5 9 4.5"/>
          </svg>
        </button>
        <button id="composer-send" class="composer-btn composer-send" type="button" title="Send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3v10"/><path d="m4 7 4-4 4 4"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Model picker popover -->
  <div id="model-menu" class="model-menu" hidden></div>

  <script type="module" src="/src/renderer/main.ts"></script>
</body>
</html>
