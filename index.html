<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hideout</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <script type="module" src="/src/renderer/main.ts"></script>
  </head>
  <body class="flex h-screen antialiased">
    <!-- Left sidebar shell, full height so it reaches the top edge and sits
         over the title-bar area on the leading side (the traffic lights float
         above it). Empty for now; width is user-resizable from the edge and
         animated on collapse. -->
    <aside id="sidebar" class="glass-pane h-full shrink-0 overflow-hidden border-r border-line/60 transition-[width] duration-200 ease-out">
      <!-- Empty shell for now. All window controls live in the title-bar
           group on the right (#titlebar-controls), which stays visible in
           both states. -->
    </aside>
    <!-- Drag handle between the sidebar and the content; resizes the sidebar. -->
    <div id="sidebar-resizer" aria-hidden="true" class="w-1.5 shrink-0 cursor-col-resize select-none bg-transparent transition-colors hover:bg-accent/30 active:bg-accent/50"></div>
    <!-- Right pane: the title bar strip over it, then the page content. -->
    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Custom title bar. A drag region (wired in src/renderer/main.ts via
           startDragging) that overlays the content on the right pane only. -->
      <header data-drag class="flex h-[var(--vantail-titlebar-height,36px)] shrink-0 select-none items-start" style="padding-left: 0.5rem; padding-right: 1.25rem">
        <!-- Model selector: a dropdown in the same glass style as the
             right-side controls, parked on the same traffic-light row.
             The menu is empty for now - no dummy data. -->
        <div id="model-selector" data-titlebar-row class="relative flex h-[40px] items-center">
          <button
            id="model-selector-toggle"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            class="titlebar-group relative flex h-[40px] w-44 cursor-pointer items-center justify-center rounded-full border border-line/70 bg-card/80 px-4 text-sm font-medium text-dim backdrop-blur-md transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
          >
            Models
            <i id="model-selector-chevron" class="absolute right-4 size-4 transition-transform duration-150" data-lucide="chevron-down"></i>
          </button>
          <div
            id="model-dropdown"
            role="listbox"
            aria-label="Models"
            class="glass-pane absolute left-0 top-[calc(100%+0.5rem)] z-50 w-44 rounded-xl border border-line/70 px-15 py-2 shadow-2xl"
            hidden
          ></div>
        </div>
        <!-- The theme + collapse buttons and the search button live here on
             the right of the title bar in both sidebar states (chrome in
             .titlebar-group, styles.css), so the window controls are always
             reachable from the same place. -->
        <div id="titlebar-controls" data-titlebar-row class="ml-auto flex items-center gap-3">
          <div class="titlebar-group flex h-[40px] items-center rounded-full border border-line/70 bg-card/80 px-2 backdrop-blur-md">
            <button
              type="button"
              aria-label="Settings"
              class="grid size-8 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-5" data-lucide="settings"></i>
            </button>
            <button
              data-theme-toggle
              type="button"
              aria-label="Switch to dark mode"
              class="grid size-8 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-5" data-theme-icon="light" data-lucide="moon"></i>
              <i class="size-5" data-theme-icon="dark" data-lucide="sun" hidden></i>
            </button>
            <button
              id="sidebar-toggle"
              data-sidebar-toggle
              type="button"
              aria-label="Toggle sidebar"
              aria-expanded="true"
              class="grid size-8 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-5" data-lucide="panel-left"></i>
            </button>
          </div>
          <div
            id="titlebar-search"
            role="search"
            aria-label="Search"
            aria-expanded="false"
            class="titlebar-group flex size-10 shrink-0 cursor-pointer items-center rounded-full border border-line/70 bg-card/80 text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15 backdrop-blur-md"
          >
            <i class="size-5 shrink-0" data-lucide="search"></i>
            <input id="titlebar-search-field" type="text" placeholder="Search" aria-label="search" />
            <button
              id="titlebar-search-clear"
              type="button"
              aria-label="Clear search"
              tabindex="-1"
              class="grid size-5 shrink-0 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
              hidden
            >
              <i class="size-3.5" data-lucide="x"></i>
            </button>
          </div>
        </div>
      </header>
      <main class="flex min-h-0 flex-1 flex-col p-6">
        <div class="grid min-h-0 flex-1 place-items-center">
          <section
            id="greeting"
            aria-live="polite"
            class="glass-pane w-full max-w-xl rounded-2xl border border-line p-8"
            hx-get="/greet"
            hx-trigger="change from:#who"
            hx-include="#who"
            hx-target="this"
            hx-swap="innerHTML"
          >
            <!-- The user's name is filled in here by src/renderer/main.ts once
                 the runtime has answered, then htmx re-requests /greet with it. -->
            <input id="who" type="hidden" name="name" value="friend" />
            <div class="flex items-center gap-3 animate-pulse">
              <span class="size-2.5 rounded-full bg-emerald-400" aria-hidden="true"></span>
              <p class="text-sm text-dim">Waking up…</p>
            </div>
          </section>
        </div>
        <!-- Chat composer, docked to the bottom of the content area and always
             centred horizontally - a frosted-glass pill in the same style as
             the title-bar search (titlebar-group + card/line palette), with an
             attachment control, a free-text field and a voice-input control.
             Empty by design: no dummy data, and the message goes nowhere yet. -->
        <div class="flex shrink-0 justify-center pt-8">
          <div
            id="composer"
            class="titlebar-group flex h-12 w-full max-w-xl items-center rounded-full border border-line/70 bg-card/80 px-1.5 backdrop-blur-md"
          >
            <button
              type="button"
              aria-label="Add attachment"
              class="grid size-9 shrink-0 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-5" data-lucide="plus"></i>
            </button>
            <button
              type="button"
              aria-label="Tools"
              class="grid size-9 shrink-0 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-5" data-lucide="wrench"></i>
            </button>
            <input
              id="composer-field"
              type="text"
              placeholder="Ask anything"
              aria-label="Message"
              class="min-w-0 flex-1 border-0 bg-transparent text-sm text-ink caret-ink outline-none placeholder:text-dim"
            />
            <button
              type="button"
              aria-label="Voice input"
              class="grid size-9 shrink-0 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-5" data-lucide="mic"></i>
            </button>
          </div>
        </div>
      </main>
    </div>
    <noscript>
      <p>This window needs JavaScript to greet you.</p>
    </noscript>
  </body>
</html>
