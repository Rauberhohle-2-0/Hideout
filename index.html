<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hideout</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <script type="module" src="/src/renderer/main.ts"></script>
  </head>
  <body class="flex h-screen flex-col antialiased">
    <!-- Custom title bar. The whole bar is a drag region (wired in
         src/renderer/main.ts via startDragging); the window controls are
         painted by us in the trailing corner. -->
    <header
      data-drag
      class="flex h-[var(--vantail-titlebar-height,48px)] shrink-0 select-none items-center justify-between border-b border-line/60 px-4"
    >
      <span class="pl-2 text-sm font-medium text-dim">Hideout</span>
      <div id="window-controls" class="flex items-center gap-1">
        <button
          type="button"
          data-action="minimize"
          aria-label="Minimize"
          class="grid size-7 place-items-center rounded-md text-dim transition-colors hover:bg-white/10 hover:text-ink"
        >
          <svg class="size-3" viewBox="0 0 12 12" aria-hidden="true">
            <line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <button
          type="button"
          data-action="maximize"
          aria-label="Maximize"
          class="grid size-7 place-items-center rounded-md text-dim transition-colors hover:bg-white/10 hover:text-ink"
        >
          <svg class="size-3" viewBox="0 0 12 12" aria-hidden="true">
            <rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
        <button
          type="button"
          data-action="close"
          aria-label="Close"
          class="grid size-7 place-items-center rounded-md text-dim transition-colors hover:bg-red-500/90 hover:text-white"
        >
          <svg class="size-3" viewBox="0 0 12 12" aria-hidden="true">
            <line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>
    <main class="flex min-h-0 flex-1 items-center justify-center p-6">
      <section
        id="greeting"
        aria-live="polite"
        class="w-full max-w-xl rounded-2xl border border-line bg-card p-8 shadow-xl"
        hx-get="/greet"
        hx-trigger="change from:#who"
        hx-include="#who"
        hx-target="this"
        hx-swap="innerHTML"
      >
        <!-- The user's name is filled in here by src/renderer/main.ts once the
             runtime has answered, then htmx re-requests /greet with it. -->
        <input id="who" type="hidden" name="name" value="friend" />
        <div class="flex items-center gap-3 animate-pulse">
          <span class="size-2.5 rounded-full bg-emerald-400" aria-hidden="true"></span>
          <p class="text-sm text-dim">Waking up…</p>
        </div>
      </section>
    </main>
    <noscript>
      <p>This window needs JavaScript to greet you.</p>
    </noscript>
  </body>
</html>
