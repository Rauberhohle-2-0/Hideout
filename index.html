<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hideout</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="h-screen antialiased">
    <main class="flex h-screen items-center justify-center p-6">
      <section
        id="greeting"
        aria-live="polite"
        class="w-full max-w-xl rounded-2xl border border-line bg-card p-8 shadow-xl"
        hx-get="/greet"
        hx-trigger="change from:#who"
        hx-include="#who"
        hx-target="this"
        hx-swap="innerHTML"
      >
        <!-- The user's name is filled in here by src/main.ts once the runtime
             has answered, then htmx re-requests /greet with it. -->
        <input id="who" type="hidden" name="name" value="friend" />
        <div class="flex items-center gap-3 animate-pulse">
          <span class="size-2.5 rounded-full bg-emerald-400" aria-hidden="true"></span>
          <p class="text-sm text-dim">Waking up…</p>
        </div>
      </section>
    </main>
    <noscript>
      <p>This window needs JavaScript to greet you.</p>
    </noscript>
  </body>
</html>
