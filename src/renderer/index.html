<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hideout</title>
  <!-- Strict CSP: no unsafe-eval, no remote resources, only self -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none';" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    #hello { font-size: 2rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1 id="hello">Hello World</h1>
  <!-- Renderer is untrusted: no Node integration, only contextBridge API -->
  <script type="module" src="./renderer.js"></script>
</body>
</html>
