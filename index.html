<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hideout</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <script type="module" src="/src/renderer/main.ts"></script>
  </head>
  <body class="flex h-screen antialiased">
    <!-- Left sidebar shell, full height so it reaches the top edge and sits
         over the title-bar area on the leading side (the traffic lights float
         above it). Empty for now; width is user-resizable from the edge and
         animated on collapse. -->
    <aside
      id="sidebar"
      class="h-full shrink-0 overflow-hidden border-r border-line/60 transition-[width] duration-200 ease-out"
    >
      <!-- Empty shell for now. All window controls live in the title-bar
           group on the right (#titlebar-controls), which stays visible in
           both states. -->
    </aside>
    <!-- Drag handle between the sidebar and the content; resizes the sidebar. -->
    <div
      id="sidebar-resizer"
      aria-hidden="true"
      class="w-1.5 shrink-0 cursor-col-resize select-none bg-transparent transition-colors hover:bg-accent/30 active:bg-accent/50"
    ></div>
    <!-- Right pane: the title bar strip over it, then the page content. -->
    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Custom title bar. A drag region (wired in src/renderer/main.ts via
           startDragging) that overlays the content on the right pane only. -->
      <header
        data-drag
        class="flex h-[var(--vantail-titlebar-height,36px)] shrink-0 select-none items-center"
        style="padding-left: 0.5rem; padding-right: 1.25rem"
      >
        <!-- The theme + collapse buttons and the search button live here on
             the right of the title bar in both sidebar states (chrome in
             .titlebar-group, styles.css), so the window controls are always
             reachable from the same place. -->
        <div
          id="titlebar-controls"
          class="ml-auto flex items-center gap-1.5"
        >
          <div
            class="titlebar-group flex h-[30px] items-center rounded-full border border-line/70 bg-card/80 px-1.5 backdrop-blur-md"
          >
            <button
              data-theme-toggle
              type="button"
              aria-label="Switch to dark mode"
              class="grid size-7 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-4" data-theme-icon="light" data-lucide="moon"></i>
              <i class="size-4" data-theme-icon="dark" data-lucide="sun" hidden></i>
            </button>
            <button
              id="sidebar-toggle"
              data-sidebar-toggle
              type="button"
              aria-label="Toggle sidebar"
              aria-expanded="true"
              class="grid size-7 place-items-center rounded-full text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15"
            >
              <i class="size-4" data-lucide="panel-left"></i>
            </button>
          </div>
          <button
            id="titlebar-search"
            type="button"
            aria-label="Search"
            class="titlebar-group grid size-7 shrink-0 place-items-center rounded-full border border-line/70 bg-card/80 text-dim transition-colors duration-150 hover:bg-black/10 hover:text-ink active:bg-black/15 dark:hover:bg-white/10 dark:hover:text-ink dark:active:bg-white/15 backdrop-blur-md"
          >
            <i class="size-4" data-lucide="search"></i>
          </button>
        </div>
      </header>
      <main class="grid min-h-0 flex-1 place-items-center p-6">
        <section
          id="greeting"
          aria-live="polite"
          class="w-full max-w-xl rounded-2xl border border-line bg-card p-8 shadow-xl"
          hx-get="/greet"
          hx-trigger="change from:#who"
          hx-include="#who"
          hx-target="this"
          hx-swap="innerHTML"
        >
          <!-- The user's name is filled in here by src/renderer/main.ts once
               the runtime has answered, then htmx re-requests /greet with it. -->
          <input id="who" type="hidden" name="name" value="friend" />
          <div class="flex items-center gap-3 animate-pulse">
            <span class="size-2.5 rounded-full bg-emerald-400" aria-hidden="true"></span>
            <p class="text-sm text-dim">Waking up…</p>
          </div>
        </section>
      </main>
    </div>
    <noscript>
      <p>This window needs JavaScript to greet you.</p>
    </noscript>
  </body>
</html>
