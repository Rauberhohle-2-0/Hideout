<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hideout</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <script type="module" src="/src/renderer/main.ts"></script>
  </head>
  <body class="flex h-screen flex-col antialiased">
    <!-- Custom title bar. The whole bar is a drag region (wired in
         src/renderer/main.ts via startDragging); the platform's own traffic
         lights sit at the leading edge. No title here - the bar is left to
         the window controls, padded rather than clamped to the corner. -->
    <header
      data-drag
      class="flex h-[var(--vantail-titlebar-height,28px)] shrink-0 select-none items-center border-b border-line/60"
      style="padding-left: var(--vantail-titlebar-inset-left, 1.25rem); padding-right: 1.25rem"
    ></header>
    <main class="flex min-h-0 flex-1 items-center justify-center p-6">
      <section
        id="greeting"
        aria-live="polite"
        class="w-full max-w-xl rounded-2xl border border-line bg-card p-8 shadow-xl"
        hx-get="/greet"
        hx-trigger="change from:#who"
        hx-include="#who"
        hx-target="this"
        hx-swap="innerHTML"
      >
        <!-- The user's name is filled in here by src/renderer/main.ts once the
             runtime has answered, then htmx re-requests /greet with it. -->
        <input id="who" type="hidden" name="name" value="friend" />
        <div class="flex items-center gap-3 animate-pulse">
          <span class="size-2.5 rounded-full bg-emerald-400" aria-hidden="true"></span>
          <p class="text-sm text-dim">Waking up…</p>
        </div>
      </section>
    </main>
    <noscript>
      <p>This window needs JavaScript to greet you.</p>
    </noscript>
  </body>
</html>
