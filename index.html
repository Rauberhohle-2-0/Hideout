<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hideout</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
    <script type="module" src="/src/renderer/main.ts"></script>
  </head>
  <body class="flex h-screen antialiased">
    <!-- Left sidebar shell, full height so it reaches the top edge and sits
         over the title-bar area on the leading side (the traffic lights float
         above it). Empty for now; width is user-resizable from the edge and
         animated on collapse. -->
    <aside
      id="sidebar"
      class="h-full shrink-0 overflow-hidden border-r border-line/60 transition-[width] duration-200 ease-out"
    >
      <!-- Top row of the sidebar; the macOS traffic lights sit in this same
           band at the leading edge, and the collapse toggle sits to their
           right, level with them. -->
      <div
        class="flex h-[var(--vantail-titlebar-height,36px)] shrink-0 select-none items-center justify-end gap-1 px-2"
      >
        <!-- Theme toggle (moon while light: clicking goes dark; the sun
             replaces it in dark mode via src/renderer/main.ts). -->
        <button
          data-theme-toggle
          type="button"
          aria-label="Switch to dark mode"
          class="grid size-6 place-items-center rounded-md text-dim transition-colors hover:bg-black/10 hover:text-ink dark:hover:bg-white/10"
        >
          <svg class="size-3.5" data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="size-3.5" data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        </button>
        <button
          data-sidebar-toggle
          type="button"
          aria-label="Toggle sidebar"
          aria-expanded="true"
          class="grid size-6 place-items-center rounded-md text-dim transition-colors hover:bg-black/10 hover:text-ink dark:hover:bg-white/10"
        >
          <svg class="size-3.5" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
            <line x1="7" y1="2" x2="7" y2="14" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
    </aside>
    <!-- Drag handle between the sidebar and the content; resizes the sidebar. -->
    <div
      id="sidebar-resizer"
      aria-hidden="true"
      class="w-1.5 shrink-0 cursor-col-resize select-none bg-transparent transition-colors hover:bg-accent/30 active:bg-accent/50"
    ></div>
    <!-- Right pane: the title bar strip over it, then the page content. -->
    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Custom title bar. A drag region (wired in src/renderer/main.ts via
           startDragging) that overlays the content on the right pane only. -->
      <header
        data-drag
        class="flex h-[var(--vantail-titlebar-height,36px)] shrink-0 select-none items-center"
        style="padding-left: 0.5rem; padding-right: 1.25rem"
      >
        <!-- The same controls, parked in the title bar while the sidebar is
             closed: the collapse toggle (in-sidebar button leads otherwise)
             with the theme toggle to its left. Both move together, so the
             dark-mode button stays one button left of collapse in either
             state. -->
        <div id="titlebar-controls" class="ml-auto flex items-center gap-1" hidden>
          <button
            data-theme-toggle
            type="button"
            aria-label="Switch to dark mode"
            class="grid size-6 place-items-center rounded-md text-dim transition-colors hover:bg-black/10 hover:text-ink dark:hover:bg-white/10"
          >
            <svg class="size-3.5" data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg class="size-3.5" data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
          </button>
          <button
            id="sidebar-toggle"
            data-sidebar-toggle
            type="button"
            aria-label="Toggle sidebar"
            aria-expanded="true"
            class="grid size-6 place-items-center rounded-md text-dim transition-colors hover:bg-black/10 hover:text-ink dark:hover:bg-white/10"
          >
            <svg class="size-3.5" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
              <line x1="7" y1="2" x2="7" y2="14" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>
      </header>
      <main class="flex min-h-0 flex-1 items-center justify-center p-6">
        <section
          id="greeting"
          aria-live="polite"
          class="w-full max-w-xl rounded-2xl border border-line bg-card p-8 shadow-xl"
          hx-get="/greet"
          hx-trigger="change from:#who"
          hx-include="#who"
          hx-target="this"
          hx-swap="innerHTML"
        >
          <!-- The user's name is filled in here by src/renderer/main.ts once
               the runtime has answered, then htmx re-requests /greet with it. -->
          <input id="who" type="hidden" name="name" value="friend" />
          <div class="flex items-center gap-3 animate-pulse">
            <span class="size-2.5 rounded-full bg-emerald-400" aria-hidden="true"></span>
            <p class="text-sm text-dim">Waking up…</p>
          </div>
        </section>
      </main>
    </div>
    <noscript>
      <p>This window needs JavaScript to greet you.</p>
    </noscript>
  </body>
</html>
